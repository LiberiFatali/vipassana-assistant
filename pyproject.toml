[project]
name = "vipassana-ucenlist-agent"
version = "0.1.0"
description = "Vipassana UCENLIST Chatbot Agent — integrates knowledge skill and MCP course discovery"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-adk>=2.3.0",
    "mcp[cli]>=1.28.1",
    "python-dotenv>=1.2.2",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chatbot_agent"]
