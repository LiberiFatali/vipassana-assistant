[project]
name = "vipassana-mcp"
version = "0.1.0"
description = "MCP server for Vipassana course discovery at UCENLIST centers in Vietnam"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "python-dateutil>=2.9.0",
]

[project.scripts]
vipassana-mcp = "vipassana_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vipassana_mcp"]
